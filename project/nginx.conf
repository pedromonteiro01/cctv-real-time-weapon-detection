# Define upstream server pool for API
upstream backend_api {
    least_conn;
    server 172.17.0.1:8000;
    server 172.17.0.1:8001;
    server 172.17.0.1:8002; 
}

# Define upstream server pool for WebSocket connections
upstream backend_ws {
    server 172.17.0.1:8000;
    server 172.17.0.1:8001;
    server 172.17.0.1:8002;
}

server {
    listen 8080;

    server_name _;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_api;  # This will now load balance between the servers defined in the upstream backend_api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;  # Increase the max body size for video uploads
    }

    location /static/ {
        alias /path/to/your/project/staticfiles/;
        autoindex on;  # Optional: allows directory listing
    }

    location /media/ {
        alias /home/pedro/Desktop/cctv-real-time-weapon-detection/project/backend/media;
        autoindex on;  # Optional: allows directory listing
    }

    location /ws/ {
        proxy_pass http://backend_ws;  # Route WebSocket connections through the WebSocket upstream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
