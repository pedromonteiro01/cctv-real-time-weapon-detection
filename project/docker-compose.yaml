version: '3.8'

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Root password
      MYSQL_DATABASE: mydatabase  # Database name
      MYSQL_USER: user  # User
      MYSQL_PASSWORD: userpassword  # User password
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "
        python manage.py wait_for_db &&
        python manage.py makemigrations base &&
        python manage.py migrate base &&
        python manage.py migrate --fake &&
        python manage.py populate_db && 
        uvicorn backend.asgi:application --host 0.0.0.0 --reload
      "
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
    ports:
      - "8000:8000"


volumes:
  mysql-data:
